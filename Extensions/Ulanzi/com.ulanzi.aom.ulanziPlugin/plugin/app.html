<!doctype html>
<html><head><meta charset="utf-8"><title>AOM Deck</title></head><body>
<script src="../libs/js/constants.js"></script>
<script src="../libs/js/eventEmitter.js"></script>
<script src="../libs/js/timers.js"></script>
<script src="../libs/js/utils.js"></script>
<script src="../libs/js/ulanziApi.js"></script>
<script>
'use strict';
(function () {
 const plugin = 'com.ulanzi.ulanzistudio.aom';
 const idPattern = /^com[.]ulanzi[.]ulanzistudio[.]aom[.](key(0[1-9]|1[0-6])|dial0[1-3])$/;
 function action(message) {
   if (!message || typeof message.context !== 'string') return null;
   try {
     const id = $UD.decodeContext(message.context).actionid;
     return idPattern.test(id) ? id.split('.').pop() : null;
   } catch (_) { return null; }
 }
 function dispatch(name) {
   if (!/^(ulanzi-key-(0[1-9]|1[0-6])|ulanzi-dial-0[1-3]-(left|right|press))$/.test(name)) return;
   $UD.openUrl('aom://trigger?name=' + encodeURIComponent(name));
 }
 $UD.connect(plugin);
 $UD.onRun(message => {
   const id = action(message);
   if (id && id.startsWith('key')) dispatch('ulanzi-key-' + id.slice(3));
 });
 $UD.onDialDown(message => {
   const id = action(message);
   if (id && id.startsWith('dial')) dispatch('ulanzi-dial-' + id.slice(4) + '-press');
 });
 $UD.onDialRotate(message => {
   const id = action(message);
   if (!id || !id.startsWith('dial')) return;
   if (message.rotateEvent === 'left' || message.rotateEvent === 'right') {
      dispatch('ulanzi-dial-' + id.slice(4) + '-' + message.rotateEvent);
   }
 });
})();
</script></body></html>
