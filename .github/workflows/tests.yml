name: All of MacOS macOS CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/aom-studio-cursor-20261013']
  pull_request:

permissions:
  contents: read

# Preserve the scarce macOS runners for the newest PR revision. Never cancel
# main-branch runs, where a trusted signed release may be queued separately.
concurrency:
  group: aom-macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-package:
    # After trusted signing is enabled, main pushes use the signed workflow instead.
    # PRs and explicit CI requests stay ad-hoc and never receive signing secrets.
    if: github.event_name != 'push' || vars.AOM_SIGNING_READY != 'true'
    runs-on: ${{ startsWith(github.ref, 'refs/heads/release/') && 'macos-14' || 'macos-15' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          swift --version
          xcodebuild -version
      - name: Verify independent identifiers
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'AllOfMacOS/App/Info.plist')" = 'com.kyw.allofmacos'
      - name: Test
        run: |
          brew list webp >/dev/null 2>&1 || brew install webp
          swift test -j 2
      - name: Build test application
        env:
          ALLOFMACOS_SIGN_ID: '-'
        run: ./build-and-sign.sh
      - name: Verify application identity
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'build/All of MacOS.app/Contents/Info.plist')" = 'com.kyw.allofmacos'
          codesign --verify --deep --strict 'build/All of MacOS.app'
      - name: Package
        run: |
          hdiutil create -quiet -volname 'All of MacOS CI' -srcfolder 'build/All of MacOS.app' -format UDZO 'All-of-MacOS-CI.dmg'
          hdiutil verify 'All-of-MacOS-CI.dmg'
      - uses: actions/upload-artifact@v4
        with:
          name: All-of-MacOS-ci-testing-only
          path: All-of-MacOS-CI.dmg
          retention-days: 7
