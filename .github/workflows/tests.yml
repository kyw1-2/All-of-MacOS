name: All of MacOS macOS CI

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Also build the release app and DMG (about 20 minutes more)'
        type: boolean
        default: false
  push:
    branches: [main, 'release/aom-studio-cursor-20261013']
  pull_request:

permissions:
  contents: read

# Preserve the scarce macOS runners for the newest PR revision. Never cancel
# main-branch runs, where a trusted signed release may be queued separately.
concurrency:
  group: aom-macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-package:
    # After trusted signing is enabled, main pushes that change the app use the
    # signed workflow instead (it runs the suite before it publishes). 7.3
    # (7.2.1 audit B21): a main push that changes only the tests matched
    # neither workflow, so it ran no tests at all; this job now runs for it.
    # PRs and explicit CI requests stay ad-hoc and never receive signing secrets.
    if: >-
      github.event_name != 'push' || vars.AOM_SIGNING_READY != 'true' ||
      (startsWith(github.event.head_commit.message, 'test') || contains(github.event.head_commit.message, '[tests]'))
    runs-on: ${{ startsWith(github.ref, 'refs/heads/release/') && 'macos-14' || 'xcode-27' }}
    timeout-minutes: 55
    steps:
      # Full history: the mtime restore below needs each file's last commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Environment
        run: |
          swift --version
          xcodebuild -version
          # 7.23: the runner's cores, not the MacBook's limit of 2 (CI timing audit).
          echo "JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          echo "cores $(sysctl -n hw.ncpu), memory $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
      - name: Verify independent identifiers
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'AllOfMacOS/App/Info.plist')" = 'com.kyw.allofmacos'
      # 7.23: incremental debug builds across runs. Sources get their last
      # commit's time so the cached build only recompiles what changed.
      - name: Restore source modification times
        run: bash scripts/ci-restore-mtimes.sh
      - name: Cache the debug build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-debug-xcode27-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            spm-debug-xcode27-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.ref_name }}-
            spm-debug-xcode27-${{ hashFiles('Package.swift', 'Package.resolved') }}-main-
            spm-debug-xcode27-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Core regression checks
        run: swift test -j "$JOBS"

      # Packaged on main pushes (the testing prerelease reads that DMG) and on
      # request (Run workflow › package): a feature check takes minutes, not 40.
      - name: Build test application
        if: inputs.package || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          ALLOFMACOS_SIGN_ID: '-'
        run: |
          brew list webp >/dev/null 2>&1 || brew install webp
          ALLOFMACOS_BUILD_JOBS="$JOBS" ./build-and-sign.sh
      - name: Verify application identity
        if: inputs.package || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'build/All of MacOS.app/Contents/Info.plist')" = 'com.kyw.allofmacos'
          codesign --verify --deep --strict 'build/All of MacOS.app'
      - name: Package
        if: inputs.package || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          hdiutil create -quiet -volname 'All of MacOS CI' -srcfolder 'build/All of MacOS.app' -format UDZO 'All-of-MacOS-CI.dmg'
          hdiutil verify 'All-of-MacOS-CI.dmg'
      - uses: actions/upload-artifact@v4
        if: inputs.package || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          name: All-of-MacOS-ci-testing-only
          path: All-of-MacOS-CI.dmg
          retention-days: 7
