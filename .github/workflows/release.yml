name: All of MacOS signed release

on:
  push:
    branches: [main]
    paths:
      - "AllOfMacOS/**"
      - "XPC/**"
      - "HardwareHelper/**"
      - "Extensions/**"
      - "scripts/bundle-webp.sh"
      - "scripts/bundle-annotation-preview.sh"
      - "Package.swift"
      - "Package.resolved"
      - "build-and-sign.sh"
      - "scripts/resolve-signing-identity.sh"
      - "scripts/package-aom-dev.sh"
      - "scripts/ci-restore-mtimes.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Private signing key is exposed only to trusted main branch builds, never PRs.
permissions:
  contents: write

concurrency:
  group: aom-release-main
  cancel-in-progress: false

jobs:
  # 7.23 (CI timing audit): the suite and the signed release build run side
  # by side on two runners; publishing waits for both. Before, the release
  # build started only after the 9-minute suite, one after the other.
  tests:
    if: github.ref == 'refs/heads/main' && vars.AOM_SIGNING_READY == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore source modification times
        run: bash scripts/ci-restore-mtimes.sh
      - name: Cache the debug build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-debug-xcode27-${{ hashFiles('Package.swift', 'Package.resolved') }}-main-${{ github.sha }}
          restore-keys: |
            spm-debug-xcode27-${{ hashFiles('Package.swift', 'Package.resolved') }}-main-
      - name: Core regression checks
        run: swift test -j "$(sysctl -n hw.ncpu)"

  signed-release:
    if: github.ref == 'refs/heads/main' && vars.AOM_SIGNING_READY == 'true'
    runs-on: xcode-27
    timeout-minutes: 55
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      dmg: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      build: ${{ steps.package.outputs.build }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure signing secrets exist
        env:
          CERT: ${{ secrets.AOM_DEV_P12_BASE64 }}
          PASSWORD: ${{ secrets.AOM_DEV_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CERT" ] || [ -z "$PASSWORD" ]; then
            echo "::error::AOM_DEV_P12_BASE64 and AOM_DEV_P12_PASSWORD must be configured before signed releases."
            exit 1
          fi

      - name: Verify project identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' AllOfMacOS/App/Info.plist)" = "com.kyw.allofmacos"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          swift --version
          xcodebuild -version

      - name: Import AOM Dev signing identity into ephemeral keychain
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.AOM_DEV_P12_BASE64 }}
          p12-password: ${{ secrets.AOM_DEV_P12_PASSWORD }}

      - name: Trust self-signed AOM Dev for code-signing on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/aom-dev-public.cer"
          security find-certificate -c "AOM Dev" -p > "$cert"
          test -s "$cert"
          # Self-signed local code-signing certificates lack Apple's public CA chain.
          # Ephemeral runner system trust via non-interactive sudo (code signing only).
          perl -e 'alarm 20; exec @ARGV' sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$cert"
          rm -f "$cert"
          bash scripts/resolve-signing-identity.sh AOM\ Dev >/dev/null

      - name: Install image codec for packaging
        run: brew list webp >/dev/null 2>&1 || brew install webp

      - name: Build and sign app
        env:
          CI: "true"
          ALLOFMACOS_SKIP_AUTO_RELEASE: "1"
          ALLOFMACOS_SIGN_ID: "AOM Dev"
        shell: bash
        run: |
          set -euo pipefail
          # Whole-module optimisation codegen uses this many threads.
          ALLOFMACOS_BUILD_JOBS="$(sysctl -n hw.ncpu)" bash ./build-and-sign.sh

      - name: Verify app and XPC signatures
        shell: bash
        run: |
          set -euo pipefail
          app="build/All of MacOS.app"
          helper="$app/Contents/XPCServices/ScriptRunner.xpc"
          test -d "$helper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.kyw.allofmacos"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -Fx 'Authority=AOM Dev'
          codesign -dv --verbose=2 "$helper" 2>&1 | grep -Fx 'Authority=AOM Dev'

      - name: Package and verify DMG
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app="build/All of MacOS.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || exit 2
          [[ "$build" =~ ^[0-9A-Za-z._-]+$ ]] || exit 2
          [[ "$version" != "1.0.1" ]] || exit 2
          short="${GITHUB_SHA:0:12}"
          tag="aom-v${version}-b${build}-g${short}"
          mkdir -p build/releases
          dmg="$PWD/build/releases/All-of-MacOS-${version}-b${build}-g${short}-AOM-Dev.dmg"
          # hdiutil create fails intermittently on hosted runners (exit 1 with
          # -quiet hid why; 6.7.0 and 6.8.0 both needed a rerun). Retry, with
          # the error shown, a few times.
          created=0
          for attempt in 1 2 3 4; do
            rm -f "$dmg"
            if hdiutil create -volname "All of MacOS ${version}" -srcfolder "$app" -format UDZO "$dmg"; then
              created=1; break
            fi
            echo "hdiutil create failed (attempt $attempt); retrying in $((attempt * 10)) s"
            sleep $((attempt * 10))
          done
          test "$created" = 1
          hdiutil verify "$dmg"
          test "$(stat -f %z "$dmg")" -lt 2147483648
          checksum="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aom-signed-dmg
          path: ${{ steps.package.outputs.dmg }}
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [tests, signed-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aom-signed-dmg
          path: dmg
      - name: Check the DMG digest
        env:
          SHA256: ${{ needs.signed-release.outputs.sha256 }}
          NAME: ${{ needs.signed-release.outputs.dmg }}
        run: |
          set -euo pipefail
          echo "$SHA256  dmg/$NAME" | sha256sum -c -

      - name: Publish newest main build as GitHub Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.signed-release.outputs.tag }}
          DMG: dmg/${{ needs.signed-release.outputs.dmg }}
          VERSION: ${{ needs.signed-release.outputs.version }}
          BUILD: ${{ needs.signed-release.outputs.build }}
          SHA256: ${{ needs.signed-release.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not promote an older queued run after a newer commit arrives.
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping obsolete release: main has advanced to $head_sha"
            exit 0
          fi
          cat > "$RUNNER_TEMP/aom-release-notes.md" <<EOF
          All of MacOS $VERSION ($BUILD) — AOM Dev self-signed development release.

          - Source commit: $GITHUB_SHA
          - Code signing: AOM Dev (main app and XPC helper)
          - DMG SHA-256: $SHA256 (also available in GitHub asset digest)
          - Self-signed: not Apple Developer ID signed or notarized.
          - Gatekeeper may require manual approval; no separate .sha256 asset is needed.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$(basename "$DMG")" >/dev/null; then
              gh release upload "$TAG" "$DMG" --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          else
            gh release create "$TAG" "$DMG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "All of MacOS $VERSION ($BUILD) - AOM Dev" \
              --notes-file "$RUNNER_TEMP/aom-release-notes.md" --latest
          fi
